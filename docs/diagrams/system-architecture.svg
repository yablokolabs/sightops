<text x="298" y="302.36" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start">OpenCV 5.0.0 vision engine</text>
<text x="298" y="318.94" font-size="11.5" fill="#D7E6F4" font-weight="400" text-anchor="start">Preprocessing · rescale, bilateral denoise, CLAHE</text>
<text x="298" y="334.12" font-size="11.5" fill="#D7E6F4" font-weight="400" text-anchor="start">Regions · profile regions + contour panel detection</text>
<text x="298" y="349.3" font-size="11.5" fill="#D7E6F4" font-weight="400" text-anchor="start">Indicators · HSV segmentation + hue bands</text>
<text x="298" y="364.48" font-size="11.5" fill="#D7E6F4" font-weight="400" text-anchor="start">Gauge · Hough dial + radial needle scan</text>
<text x="298" y="379.66" font-size="11.5" fill="#D7E6F4" font-weight="400" text-anchor="start">Quality · normalised Laplacian blur, exposure</text>
<text x="298" y="394.84" font-size="11.5" fill="#D7E6F4" font-weight="400" text-anchor="start">Measurements carry method, confidence, criteria</text>
<rect x="286" y="442" width="412" height="106" rx="9" fill="#053B6E" stroke="#051D35" stroke-width="1.2"/>
<text x="298" y="476.13" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start">Agent orchestration</text>
<text x="298" y="492.71" font-size="11.5" fill="#D7E6F4" font-weight="400" text-anchor="start">Typed tool registry · inspection state machine</text>
<text x="298" y="507.89" font-size="11.5" fill="#D7E6F4" font-weight="400" text-anchor="start">Bounded loop · 8 steps, 12 tool calls, 2 reinspections</text>
<text x="298" y="523.07" font-size="11.5" fill="#D7E6F4" font-weight="400" text-anchor="start">Human approval gate before any action is recorded</text>
