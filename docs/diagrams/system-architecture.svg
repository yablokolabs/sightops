<text x="54" y="660" font-size="13" fill="#3E4D5C" font-weight="400" text-anchor="start">AWS Graviton EC2 · Cloud-Optimized OpenCV Library (COOL) · Amazon Bedrock</text>
<text x="54" y="684" font-size="13" fill="#3E4D5C" font-weight="400" text-anchor="start">Amazon S3 · Amazon DynamoDB · AWS Lambda · Amazon CloudWatch</text>
<text x="54" y="716" font-size="12.5" fill="#D13B3B" font-weight="600" text-anchor="start">No AWS account is used, no resource has been provisioned, and no AWS component has been benchmarked.</text>
<text x="54" y="740" font-size="12.5" fill="#3E4D5C" font-weight="400" text-anchor="start">SightOps runs entirely on the existing Azure virtual machine, on CPU, with no GPU.</text>
