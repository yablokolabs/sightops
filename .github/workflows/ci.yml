# Continuous integration.
#
# Every step here is a command that also runs on a developer machine, deliberately:
# a green build should mean the same thing locally and in CI, so the pipeline is a
# list of the project's own checks rather than a parallel implementation of them.
#
# No secret is needed to run any of it. The test suite and the scripted demonstration
# flows never call a provider, and the container is exercised with no keys at all,
# which is the documented degraded path.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan every tracked file for credential-shaped material
        run: python3 scripts/scan_secrets.py

  backend:
    name: backend, vision and agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # The same venv layout the README documents, so every command below is the
      # command a developer would type.
      - name: Create the virtual environment and install
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e './backend[dev]'

      - name: The vision engine really is running OpenCV 5
        run: |
          .venv/bin/python - <<'PY'
          import cv2
          print("OpenCV", cv2.__version__)
          assert cv2.__version__.startswith("5."), "this project's claims depend on OpenCV 5"
          PY

      - name: Unit and integration tests
        run: cd backend && ../.venv/bin/python -m pytest -q

      - name: Scripted demonstration scenarios
        run: cd backend && ../.venv/bin/python scripts/verify_demo_scenarios.py

      - name: Image-quality calibration
        run: cd backend && ../.venv/bin/python scripts/calibrate_quality.py

      - name: Evaluation
        run: cd backend && ../.venv/bin/python scripts/evaluate.py --out /tmp/evaluation

      - name: Evaluation metrics have not regressed
        run: python3 scripts/check_evaluation_metrics.py /tmp/evaluation/results.json

      - name: Keep the evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: /tmp/evaluation
          if-no-files-found: warn

  frontend:
    name: frontend and browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The end-to-end tests drive the real backend, so its dependencies are needed
      # here too. Same venv layout as the backend job, which is what
      # frontend/playwright.config.ts expects to find.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install the backend the tests will drive
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e './backend[dev]'

      - name: Install the client
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npm run typecheck

      - name: Production build
        run: cd frontend && npm run build

      - name: Install the browser
        run: cd frontend && npx playwright install --with-deps chromium

      # Playwright starts uvicorn and the preview server itself, tests them, and
      # shuts them down. `reuseExistingServer` is off under CI, so the servers are
      # always the ones this run started.
      - name: Browser end-to-end tests
        run: cd frontend && npm run test:e2e

      # A webServer timeout says only that something never became reachable. This
      # turns that into a diagnosis: which sockets are listening, and what each URL
      # answers. Without it, a start-up failure reads as a 120-second silence.
      - name: Diagnose the servers if the tests could not start them
        if: failure()
        run: |
          echo '--- listening sockets ---'
          ss -ltnp || true
          echo '--- http://127.0.0.1:8000/health ---'
          curl --silent --show-error --max-time 10 http://127.0.0.1:8000/health || true
          echo
          echo '--- http://127.0.0.1:4173/ ---'
          curl --silent --show-error --max-time 10 http://127.0.0.1:4173/ || true
          echo

      - name: Keep the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  demo:
    name: demonstration video scenes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/videowright/package-lock.json

      - name: Install the video project
        run: cd demo/videowright && npm ci

      - name: Type check the scenes
        run: cd demo/videowright && npm run typecheck

      - name: Install the browser
        run: cd demo/videowright && npx playwright install --with-deps chromium

      # A render takes about half an hour and is the only other way to see a panel
      # that overflows the frame or lies across another block, so the layout is
      # measured against the dev server instead of the finished video. The check
      # used to compare elements with the frame edges only, which let six scenes
      # overlap inside the frame unnoticed; it now also fails when a stage's
      # content is taller than its row and when two blocks cover the same pixels.
      - name: Every scene fits the 1920x1080 frame and nothing overlaps
        run: |
          cd demo/videowright
          npx videowright dev --port 5199 > /tmp/videowright-dev.log 2>&1 &
          # The server binds `localhost`, and Node resolves that to whichever family
          # the host's resolver returns first. On this runner that is IPv6, while a
          # development machine usually answers on IPv4, and curl uses the first
          # address it is given rather than trying the other. So both addresses are
          # probed, and whichever answers is the one the check navigates to.
          dev_url=''
          for _ in $(seq 1 60); do
            for candidate in "http://127.0.0.1:5199" "http://[::1]:5199"; do
              if curl --silent --fail --output /dev/null "$candidate/"; then dev_url="$candidate"; break 2; fi
            done
            sleep 1
          done
          if [ -z "$dev_url" ]; then
            echo '--- the dev server answered on neither 127.0.0.1:5199 nor [::1]:5199 ---'
            ss -ltnp || true
            cat /tmp/videowright-dev.log
            exit 1
          fi
          echo "the dev server answered on $dev_url"
          node scripts/check_scene_layout.mjs --url "$dev_url/video/sightops-demo"

  docker:
    name: container build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build both images
        run: docker compose build

      # `--wait` returns once every service is healthy, so a container that starts
      # but cannot answer its own health check fails here rather than later.
      - name: Start the stack
        run: docker compose up -d --wait

      - name: Smoke test through the published entry point
        run: scripts/smoke_docker.sh

      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
