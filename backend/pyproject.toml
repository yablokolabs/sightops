[project]
name = "sightops-backend"
version = "0.1.0"
description = "SightOps — Agentic Visual Reliability Engineer (backend)"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.121.4",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.12.10",
    "pydantic-settings==2.13.1",
    "python-multipart==0.0.22",
    "httpx==0.29.2",
    "aiosqlite==0.22.1",
    "numpy==2.5.3",
    "opencv-python==5.0.0.93",
    "pillow==12.1.0",
    "scipy==1.18.1",
    "python-dotenv==1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]
