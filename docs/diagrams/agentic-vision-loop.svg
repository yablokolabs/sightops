<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-label="The perception, measurement, confidence assessment, reasoning and action loop, with a confidence gate that requests another observation when the evidence is insufficient, plus the bounds that keep the loop finite." font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>SightOps agentic vision loop</title>
<desc>The perception, measurement, confidence assessment, reasoning and action loop, with a confidence gate that requests another observation when the evidence is insufficient, plus the bounds that keep the loop finite.</desc>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#075CA7"/></marker>
<marker id="a-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#053B6E"/></marker>
<marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3E4D5C"/></marker>
<marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#FF7A1A"/></marker>
<marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2E9E5B"/></marker>
<marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#D13B3B"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8A98A6"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="880" rx="0" fill="#F7F9FB"/>
<rect x="32" y="26" width="6" height="46" rx="3" fill="#075CA7"/>
<text x="54" y="50" font-size="24" fill="#051D35" font-weight="700" text-anchor="start">Agentic Vision Loop</text>
<text x="54" y="72" font-size="10.98" fill="#3E4D5C" font-weight="400" text-anchor="start">The perception–decision–action loop. The confidence gate is the defining behaviour: insufficient evidence loops back for another observation instead of producing a conclusion.</text>
<rect x="80" y="120" width="340" height="64" rx="9" fill="#051D35" stroke="#053B6E" stroke-width="1.3"/>
<text x="93" y="148.38" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="start">1 · Image acquisition</text>
<text x="93" y="164.1" font-size="11" fill="#D7E6F4" font-weight="400" text-anchor="start">upload, camera capture, or scripted demo step</text>
<rect x="80" y="214" width="340" height="64" rx="9" fill="#051D35" stroke="#053B6E" stroke-width="1.3"/>
<text x="93" y="242.38" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="start">2 · OpenCV 5 measurement</text>
<text x="93" y="258.1" font-size="11" fill="#D7E6F4" font-weight="400" text-anchor="start">quality, regions, indicators, gauge, annotations</text>
<rect x="80" y="308" width="340" height="64" rx="9" fill="#051D35" stroke="#053B6E" stroke-width="1.3"/>
<text x="93" y="336.492" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="start">3 · Confidence assessment</text>
<text x="93" y="352.056" font-size="10.83" fill="#D7E6F4" font-weight="400" text-anchor="start">per-measurement criteria; needs_reinspection flags</text>
<line x1="250" y1="184" x2="250" y2="214" stroke="#075CA7" stroke-width="1.7" marker-end="url(#a-blue)"/>
<line x1="250" y1="278" x2="250" y2="308" stroke="#075CA7" stroke-width="1.7" marker-end="url(#a-blue)"/>
<path d="M 250 392 L 418 470 L 250 548 L 82 470 Z" fill="#FF7A1A" stroke="#B45309" stroke-width="2.2"/>
<text x="250" y="464.6" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">4 · Evidence</text>
<text x="250" y="482.42" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">sufficient?</text>
<line x1="250" y1="372" x2="250" y2="392" stroke="#075CA7" stroke-width="1.7" marker-end="url(#a-blue)"/>
<text x="260" y="404" font-size="11" fill="#B45309" font-weight="600" text-anchor="start">the confidence gate</text>
<rect x="700" y="150" width="420" height="64" rx="9" fill="#075CA7" stroke="#053B6E" stroke-width="1.3"/>
<text x="713" y="178.38" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="start">5 · Agent reasoning</text>
<text x="713" y="194.1" font-size="11" fill="#D7E6F4" font-weight="400" text-anchor="start">choose the next tool from the measurements</text>
<rect x="700" y="244" width="420" height="64" rx="9" fill="#075CA7" stroke="#053B6E" stroke-width="1.3"/>
<text x="713" y="272.38" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="start">6 · Tool execution</text>
<text x="713" y="288.1" font-size="11" fill="#D7E6F4" font-weight="400" text-anchor="start">typed, validated, recorded with its result</text>
<rect x="700" y="338" width="420" height="64" rx="9" fill="#075CA7" stroke="#053B6E" stroke-width="1.3"/>
<text x="713" y="366.38" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="start">7 · Diagnosis</text>
<text x="713" y="382.1" font-size="11" fill="#D7E6F4" font-weight="400" text-anchor="start">stated with the evidence and its confidence</text>
<rect x="700" y="432" width="420" height="64" rx="9" fill="#075CA7" stroke="#053B6E" stroke-width="1.3"/>
<text x="713" y="460.38" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="start">8 · Safe action</text>
<text x="713" y="476.1" font-size="11" fill="#D7E6F4" font-weight="400" text-anchor="start">guidance, incident, approval request</text>
<line x1="910" y1="214" x2="910" y2="244" stroke="#075CA7" stroke-width="1.7" marker-end="url(#a-blue)"/>
<line x1="910" y1="308" x2="910" y2="338" stroke="#075CA7" stroke-width="1.7" marker-end="url(#a-blue)"/>
<line x1="910" y1="402" x2="910" y2="432" stroke="#075CA7" stroke-width="1.7" marker-end="url(#a-blue)"/>
<path d="M 418 470 H 552 V 182 H 700" fill="none" stroke="#2E9E5B" stroke-width="2" marker-end="url(#a-good)"/>
<text x="424" y="460" font-size="11" fill="#2E9E5B" font-weight="600" text-anchor="start">yes — evidence is good enough</text>
<line x1="250" y1="548" x2="250" y2="620" stroke="#FF7A1A" stroke-width="1.7" marker-end="url(#a-amber)"/>
<text x="262" y="604" font-size="11.5" fill="#B45309" font-weight="700" text-anchor="start">no</text>
<rect x="80" y="620" width="580" height="76" rx="9" fill="#FF7A1A" stroke="#B45309" stroke-width="1.6"/>
<text x="93" y="654.38" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="start">Reinspection requested</text>
<text x="93" y="670.1" font-size="11" fill="#D7E6F4" font-weight="400" text-anchor="start">request_new_view: a closer photo, a different angle, or another region</text>
<path d="M 80 658 H 44 V 152 H 80" fill="none" stroke="#FF7A1A" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-amber)"/>
<text x="52" y="500" font-size="10.5" fill="#B45309" font-weight="600" text-anchor="start">observe</text>
<rect x="700" y="560" width="420" height="136" rx="9" fill="#F2F6FA" stroke="#3E4D5C" stroke-width="1.3"/>
<text x="713" y="601.15" font-size="13.5" fill="#051D35" font-weight="700" text-anchor="start">Bounded execution</text>
<text x="713" y="617.13" font-size="11.5" fill="#3E4D5C" font-weight="400" text-anchor="start">max 8 agent steps</text>
<text x="713" y="632.31" font-size="11.5" fill="#3E4D5C" font-weight="400" text-anchor="start">max 12 tool calls</text>
<text x="713" y="647.49" font-size="11.5" fill="#3E4D5C" font-weight="400" text-anchor="start">max 2 reinspection rounds</text>
<text x="713" y="662.67" font-size="11.5" fill="#3E4D5C" font-weight="400" text-anchor="start">90 s timeout per step</text>
<rect x="80" y="730" width="1040" height="112" rx="10" fill="#FFFFFF" stroke="#075CA7" stroke-width="1.6"/>
<text x="96" y="766.87" font-size="14" fill="#051D35" font-weight="700" text-anchor="start">Two brains, one loop</text>
<text x="96" y="783.05" font-size="11.5" fill="#3E4D5C" font-weight="400" text-anchor="start">LIVE — the Nebius model selects tools and receives each result back; if the provider fails the run continues and says so.</text>
<text x="96" y="798.23" font-size="11.5" fill="#3E4D5C" font-weight="400" text-anchor="start">DEMO — a deterministic policy over the same OpenCV measurements, labelled DEMO MODE everywhere; the measurements are equally real.</text>
<text x="96" y="813.41" font-size="11.5" fill="#053B6E" font-weight="600" text-anchor="start">Either way, low-confidence evidence triggers a new observation, and the new evidence changes the next action.</text>
</svg>
