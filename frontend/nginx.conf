# nginx server block for the SightOps web client (installed as
# /etc/nginx/conf.d/default.conf, so it replaces the image's default server).
#
# The client calls the API with paths relative to its own origin, so this block
# has to do both jobs: serve the compiled bundle, and forward /api and /health
# to the backend service on the compose network.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # The backend rejects uploads above 12 MiB itself. This limit sits a little
    # higher on purpose: it lets an over-sized photograph reach the backend and
    # get the readable 415/422 the API produces, instead of nginx's bare 413.
    client_max_body_size 16m;

    # Docker's embedded DNS server. Resolving the backend per request rather
    # than once at startup means a restarted backend container is picked up
    # without restarting nginx. `ipv6=off` avoids lookup failures on networks
    # with IPv6 disabled.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sightops_backend http://backend:8000;

    # Inherited by any location that does not declare its own add_header.
    add_header X-Content-Type-Options nosniff always;

    # index.html names the fingerprinted asset files, so a cached copy would
    # request paths a later deploy has already replaced.
    location = /index.html {
        expires -1;
    }

    # Vite fingerprints everything it emits here, so the contents of a given URL
    # never change and the whole directory can be cached for a year.
    location /assets/ {
        expires 1y;
    }

    location /api/ {
        # No URI part after the variable, so the request URI is forwarded
        # unchanged and the backend sees the same path the client asked for.
        proxy_pass $sightops_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An agent turn is bounded at 90 s per step, and an inspection can take
        # several steps, so the default 60 s read timeout is too short.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /health {
        proxy_pass $sightops_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Client-side routes (/inspections, /incidents, ...) are not files on disk,
    # so anything that is not a real file falls through to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
